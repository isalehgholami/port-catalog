[project]
name = "port-catalog"
version = "1.0.0"
description = "Read-only catalog of listening and Docker-published ports"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "docker>=7.0"]

[project.scripts]
port-catalog = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
