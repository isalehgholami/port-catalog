services:
  port-catalog:
    build: .
    image: port-catalog:latest
    container_name: port-catalog
    restart: unless-stopped
    network_mode: host
    pid: host  # lets it name the process behind each host port (read-only /proc access)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/ufw:/etc/ufw:ro
      - /etc/nginx:/etc/nginx:ro
      - ./data:/data
    environment:
      PORTCATALOG_BIND: "0.0.0.0"
      PORTCATALOG_PORT: "9780"
      PORT_RANGE_START: "1000"
      PORT_RANGE_END: "59999"
